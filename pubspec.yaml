name: root_jailbreak_detector
description: "Detects whether the device is rooted (Android) or jailbroken (iOS), so your app can react to running on a device it cannot trust."
version: 1.0.0
repository: https://github.com/ozanorfa/root_jailbreak_detector
issue_tracker: https://github.com/ozanorfa/root_jailbreak_detector/issues

topics:
  - security
  - root
  - jailbreak
  - device-integrity

environment:
  sdk: ^3.8.0
  # 3.44 is the floor the package is actually built and tested against, and the
  # lowest version whose Swift Package Manager integration matches Package.swift.
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.ozanorfa.rootjailbreakdetector.root_jailbreak_detector
        pluginClass: RootJailbreakDetectorPlugin
      ios:
        pluginClass: RootJailbreakDetectorPlugin
