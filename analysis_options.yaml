include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # This is a published library, so every public member needs to explain
    # itself in the generated API docs.
    - public_member_api_docs
    # A dropped future here would mean a security check that never runs.
    - unawaited_futures

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
