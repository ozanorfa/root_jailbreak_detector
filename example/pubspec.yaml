name: root_jailbreak_detector_example
description: "Demonstrates how to use the root_jailbreak_detector plugin."
publish_to: 'none'

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  root_jailbreak_detector:
    # A published app should depend on a version range instead:
    #   root_jailbreak_detector: ^1.0.0
    # The example ships with the plugin, so it uses a path dependency to always
    # build against the sources next to it.
    path: ../

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
